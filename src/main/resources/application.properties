spring.application.name=reservation2026

# URL de connexion à la base de données
spring.datasource.url=jdbc:mariadb://localhost:3306/reservations

# Identifiants de connexion
spring.datasource.username=root
spring.datasource.password=

# Driver MariaDB 
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuration Hibernate / JPA

# Enable use of hidden input to override HTML method in form (put & delete)
spring.mvc.hiddenmethod.filter.enabled=true

# 1 Désactiver la création automatique de Hibernate pour laisser la main à Flyway
spring.jpa.hibernate.ddl-auto=none

# Affiche les requêtes SQL dans la console (pratique pour le débogage)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuration de Flyway pour la gestion des migrations de base de données
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true